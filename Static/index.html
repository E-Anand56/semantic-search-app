<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Semantic Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12161c;
    --bg-hero: #10141a;
    --surface: #1a2029;
    --border: #2b333e;
    --text: #eceef1;
    --text-muted: #8b94a0;
    --text-faint: #5b6470;
    --gold: #e8a33d;
    --teal: #4fb8ae;
    --violet: #8b7fd1;
    --clay: #c97b63;
    --rose: #d38fa8;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono{ font-family: "IBM Plex Mono", monospace; }

  /* ---------- Hero ---------- */

  .hero{
    position: relative;
    background: var(--bg-hero);
    border-bottom: 1px solid var(--border);
    padding: 72px 24px 56px;
    overflow: hidden;
  }

  .vector-field{
    position:absolute;
    inset:0;
    opacity: 0.5;
    pointer-events:none;
  }

  .hero-inner{
    position:relative;
    max-width: 680px;
    margin: 0 auto;
    text-align: center;
  }

  .eyebrow{
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    color: var(--text-faint);
    letter-spacing: 0.02em;
    margin-bottom: 18px;
  }

  h1{
    font-size: 40px;
    line-height: 1.15;
    font-weight: 600;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }

  .subhead{
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto 36px;
  }

  .search-box{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 6px 6px 18px;
    transition: border-color 0.15s ease;
  }

  .search-box:focus-within{
    border-color: var(--gold);
  }

  .search-box input[type="text"]{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 16px;
    padding: 10px 0;
  }

  .search-box input::placeholder{
    color: var(--text-faint);
  }

  .search-box button{
    background: var(--gold);
    color: #1a1305;
    border: none;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    padding: 12px 20px;
    cursor: pointer;
    transition: filter 0.15s ease;
    white-space: nowrap;
  }

  .search-box button:hover{ filter: brightness(1.08); }
  .search-box button:disabled{ opacity: 0.5; cursor: default; }

  .try-row{
    margin-top: 16px;
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .try-chip{
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border);
    padding: 6px 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .try-chip:hover{
    border-color: var(--teal);
    color: var(--teal);
  }

  /* ---------- Stats strip ---------- */

  .stats-strip{
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 24px 0;
    display:flex;
    justify-content:center;
    gap: 36px;
    flex-wrap: wrap;
  }

  .stat{
    text-align:center;
  }

  .stat .value{
    font-family: "IBM Plex Mono", monospace;
    font-size: 20px;
    color: var(--text);
  }

  .stat .label{
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 2px;
  }

  /* ---------- Results ---------- */

  main{
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  .filters{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .result-meta{
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    color: var(--text-faint);
  }

  .category-select{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    padding: 7px 10px;
  }

  .related-terms{
    margin: -4px 0 24px;
    font-size: 13.5px;
    color: var(--text-faint);
    line-height: 1.7;
  }

  .related-terms .term{
    color: var(--teal);
    font-family: "IBM Plex Mono", monospace;
  }

  .result-card{
    border-top: 1px solid var(--border);
    padding: 22px 0 22px 18px;
    position: relative;
  }

  .result-card:last-child{
    border-bottom: 1px solid var(--border);
  }

  .result-card::before{
    content: "";
    position: absolute;
    left: 0;
    top: 22px;
    bottom: 22px;
    width: 3px;
    background: var(--cat-color, var(--teal));
  }

  .result-top{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 6px;
  }

  .result-title{
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
  }

  .result-score{
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    color: var(--gold);
    white-space: nowrap;
  }

  .score-track{
    height: 3px;
    background: var(--border);
    margin: 8px 0 10px;
    max-width: 220px;
  }

  .score-fill{
    height: 100%;
    background: var(--gold);
  }

  .result-text{
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.6;
    margin: 0 0 10px;
  }

  .result-tags{
    display:flex;
    gap: 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
  }

  .cat-tag{
    color: var(--cat-color, var(--teal));
  }

  .intent-tag{
    color: var(--text-faint);
  }

  /* ---------- States ---------- */

  .empty-state, .loading-state, .error-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--text-faint);
    font-size: 14.5px;
  }

  .error-state{ color: var(--clay); }

  .spinner{
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  @media (max-width: 560px){
    h1{ font-size: 30px; }
    .hero{ padding: 56px 18px 44px; }
    .search-box{ flex-direction: column; align-items: stretch; padding: 14px; }
    .search-box button{ width: 100%; }
  }

  @media (prefers-reduced-motion: reduce){
    .spinner{ animation: none; }
  }
</style>
</head>
<body>

<div class="hero">
  <svg class="vector-field" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid slice">
    <g stroke="#2b333e" stroke-width="1">
      <line x1="120" y1="60" x2="230" y2="110"/>
      <line x1="230" y1="110" x2="180" y2="200"/>
      <line x1="560" y1="80" x2="640" y2="150"/>
      <line x1="500" y1="220" x2="600" y2="260"/>
      <line x1="640" y1="150" x2="700" y2="90"/>
    </g>
    <g fill="#e8a33d" opacity="0.9">
      <circle cx="120" cy="60" r="2.5"/>
      <circle cx="230" cy="110" r="2.5"/>
    </g>
    <g fill="#4fb8ae" opacity="0.85">
      <circle cx="180" cy="200" r="2.5"/>
      <circle cx="600" cy="260" r="2.5"/>
    </g>
    <g fill="#8b7fd1" opacity="0.85">
      <circle cx="560" cy="80" r="2.5"/>
      <circle cx="640" cy="150" r="2.5"/>
      <circle cx="700" cy="90" r="2.5"/>
      <circle cx="500" cy="220" r="2.5"/>
    </g>
    <g fill="#5b6470" opacity="0.6">
      <circle cx="60" cy="180" r="2"/>
      <circle cx="340" cy="40" r="2"/>
      <circle cx="420" cy="250" r="2"/>
      <circle cx="740" cy="230" r="2"/>
      <circle cx="30" cy="270" r="2"/>
      <circle cx="270" cy="270" r="2"/>
      <circle cx="470" cy="120" r="2"/>
    </g>
  </svg>

  <div class="hero-inner">
    <div class="eyebrow mono">word2vec &middot; cosine similarity</div>
    <h1>Search by meaning, not keywords</h1>
    <p class="subhead">Every document is embedded as a vector. Type a question or a phrase — the closest matches in meaning surface first, even without shared words.</p>

    <div class="search-box">
      <input type="text" id="query-input" placeholder="e.g. I want to work from home" autocomplete="off" />
      <button id="search-btn">Search</button>
    </div>

    <div class="try-row" id="try-row"></div>
  </div>
</div>

<div class="stats-strip" id="stats-strip"></div>

<main>
  <div class="filters" id="filters" style="display:none;">
    <div class="result-meta" id="result-meta"></div>
    <select class="category-select" id="category-select">
      <option value="All">All categories</option>
    </select>
  </div>

  <div class="related-terms" id="related-terms" style="display:none;"></div>

  <div id="results-container">
    <div class="empty-state">Try a search above to see matching documents, ranked by semantic similarity.</div>
  </div>
</main>

<script>
  const CATEGORY_COLORS = {
    "IT": "#4fb8ae",
    "HR": "#e8a33d",
    "AI/ML": "#8b7fd1",
  };
  const FALLBACK_COLORS = ["#c97b63", "#d38fa8", "#4fb8ae", "#e8a33d", "#8b7fd1"];
  const catColorCache = {};

  function colorForCategory(cat){
    if (CATEGORY_COLORS[cat]) return CATEGORY_COLORS[cat];
    if (!catColorCache[cat]){
      const idx = Object.keys(catColorCache).length % FALLBACK_COLORS.length;
      catColorCache[cat] = FALLBACK_COLORS[idx];
    }
    return catColorCache[cat];
  }

  const EXAMPLE_QUERIES = [
    "I want to work from home",
    "forgot my password",
    "how many vacation days do I get",
    "what is machine learning",
  ];

  const tryRow = document.getElementById("try-row");
  EXAMPLE_QUERIES.forEach(q => {
    const chip = document.createElement("button");
    chip.className = "try-chip";
    chip.textContent = q;
    chip.onclick = () => { input.value = q; runSearch(); };
    tryRow.appendChild(chip);
  });

  const input = document.getElementById("query-input");
  const searchBtn = document.getElementById("search-btn");
  const resultsContainer = document.getElementById("results-container");
  const filtersEl = document.getElementById("filters");
  const resultMetaEl = document.getElementById("result-meta");
  const categorySelect = document.getElementById("category-select");
  const relatedTermsEl = document.getElementById("related-terms");
  const statsStrip = document.getElementById("stats-strip");

  let lastQuery = "";

  async function loadStats(){
    try{
      const res = await fetch("/api/stats");
      const data = await res.json();
      if (!data.ready){
        statsStrip.innerHTML = `<div class="stat"><div class="value mono" style="color:#c97b63">offline</div><div class="label">${data.error ? escapeHtml(data.error).slice(0,60) : "model not ready"}</div></div>`;
        return;
      }
      statsStrip.innerHTML = `
        <div class="stat"><div class="value mono">${data.total_documents.toLocaleString()}</div><div class="label">documents indexed</div></div>
        <div class="stat"><div class="value mono">${data.vector_size}</div><div class="label">vector dimensions</div></div>
        <div class="stat"><div class="value mono">${data.vocabulary_size.toLocaleString()}</div><div class="label">vocabulary size</div></div>
      `;
      (data.categories || []).forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        categorySelect.appendChild(opt);
      });
    }catch(e){
      statsStrip.innerHTML = "";
    }
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function runSearch(){
    const q = input.value.trim();
    if (!q) return;
    lastQuery = q;

    searchBtn.disabled = true;
    searchBtn.textContent = "Searching…";
    filtersEl.style.display = "none";
    relatedTermsEl.style.display = "none";
    resultsContainer.innerHTML = `<div class="loading-state"><div class="spinner"></div>Embedding query and ranking documents…</div>`;

    try{
      const category = categorySelect.value;
      const params = new URLSearchParams({ q, top_k: "8" });
      if (category && category !== "All") params.set("category", category);

      const res = await fetch(`/api/search?${params.toString()}`);
      if (!res.ok){
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }
      const data = await res.json();
      renderResults(data);
    }catch(e){
      resultsContainer.innerHTML = `<div class="error-state">${escapeHtml(e.message || "Something went wrong.")}</div>`;
    }finally{
      searchBtn.disabled = false;
      searchBtn.textContent = "Search";
    }
  }

  function renderResults(data){
    filtersEl.style.display = "flex";
    resultMetaEl.textContent = `${data.count} result${data.count === 1 ? "" : "s"} for "${data.query}"`;

    if (data.related_terms && data.related_terms.length){
      relatedTermsEl.style.display = "block";
      relatedTermsEl.innerHTML = "Semantically related: " +
        data.related_terms.map(t => `<span class="term">${escapeHtml(t)}</span>`).join(", ");
    } else {
      relatedTermsEl.style.display = "none";
    }

    if (!data.results.length){
      resultsContainer.innerHTML = `<div class="empty-state">No documents matched closely enough. Try rephrasing, or clear the category filter.</div>`;
      return;
    }

    const maxScore = Math.max(...data.results.map(r => r.score), 0.0001);

    resultsContainer.innerHTML = data.results.map(r => {
      const color = colorForCategory(r.category);
      const pct = Math.max(4, (r.score / maxScore) * 100);
      return `
        <div class="result-card" style="--cat-color:${color}">
          <div class="result-top">
            <div class="result-title">${escapeHtml(r.title)}</div>
            <div class="result-score mono">${r.score.toFixed(4)}</div>
          </div>
          <div class="score-track"><div class="score-fill" style="width:${pct}%; background:${color}"></div></div>
          <p class="result-text">${escapeHtml(r.text)}</p>
          <div class="result-tags">
            <span class="cat-tag" style="--cat-color:${color}">${escapeHtml(r.category)}</span>
            <span class="intent-tag">${escapeHtml(r.intent)}</span>
          </div>
        </div>
      `;
    }).join("");
  }

  searchBtn.addEventListener("click", runSearch);
  input.addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });
  categorySelect.addEventListener("change", () => { if (lastQuery) runSearch(); });

  loadStats();
</script>

</body>
</html>
